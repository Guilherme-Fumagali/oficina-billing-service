apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: oficina
data:
  SPRING_PROFILES_ACTIVE: k8s
  ENV: staging
  NEW_RELIC_APP_NAME: oficina-billing-service-staging
  NEW_RELIC_LOG_FILE_NAME: STDOUT
  AWS_REGION: us-east-1
  FILA_OS_EVENTOS: oficina-staging-os-eventos
  FILA_BILLING_COMANDOS: oficina-staging-billing-comandos
  FILA_DLQ: oficina-staging-billing-comandos-dlq
  NOTIFICACAO_CANAL: smtp
  SMTP_HOST: oficina-mailhog
  SMTP_PORT: "1025"
  MAIL_FROM: oficina@example.com
  ORCAMENTO_VALIDADE_HORAS: "168"
  PAGAMENTO_PRAZO_HORAS: "24"
  MP_USAR_SANDBOX_INIT_POINT: "false"
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: https://otlp.nr-data.net/v1/metrics
