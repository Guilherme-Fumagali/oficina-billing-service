spring:
  application:
    name: billing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/billing}
    username: ${DB_USER:billing}
    password: ${DB_PASS:billing}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      pool:
        size: 4
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      sqs:
        queue-not-found-strategy: fail

server:
  port: ${PORT:8080}
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  url-publica: ${APP_URL_PUBLICA:http://localhost:8081}
  orcamento:
    validade-horas: ${ORCAMENTO_VALIDADE_HORAS:168}
    expiracao:
      intervalo: ${ORCAMENTO_EXPIRACAO_INTERVALO:300000}
      atraso-inicial: 60000
      lote: 50
  pagamento:
    prazo-horas: ${PAGAMENTO_PRAZO_HORAS:24}
    recusa-encerra: ${PAGAMENTO_RECUSA_ENCERRA:true}
    reconciliacao:
      intervalo: ${PAGAMENTO_RECONCILIACAO_INTERVALO:60000}
      atraso-inicial: 60000
      idade-minima: 60s
      reserva: 2m
      lote: 20
  mercado-pago:
    url-base: ${MP_URL_BASE:https://api.mercadopago.com}
    access-token: ${MP_ACCESS_TOKEN:}
    webhook-secret: ${MP_WEBHOOK_SECRET:}
    exigir-assinatura: ${MP_EXIGIR_ASSINATURA:true}
    usar-sandbox-init-point: ${MP_USAR_SANDBOX_INIT_POINT:false}
    url-retorno: ${MP_URL_RETORNO:${app.url-publica}/api/ordens/{osId}/status}
    email-pagador-teste: ${MP_EMAIL_PAGADOR_TESTE:}
    timeout-conexao: 2s
    timeout-leitura: 5s
  notificacao:
    canal: ${NOTIFICACAO_CANAL:log}
  mail:
    from: ${MAIL_FROM:oficina@example.com}
  mensageria:
    filas:
      os-eventos: ${FILA_OS_EVENTOS:oficina-local-os-eventos}
      billing-comandos: ${FILA_BILLING_COMANDOS:oficina-local-billing-comandos}
      entrada: ${app.mensageria.filas.billing-comandos}
    dlq: ${FILA_DLQ:${app.mensageria.filas.billing-comandos}-dlq}
    relay:
      intervalo: 500
      lote: 50
    dlq-monitor:
      intervalo: 60000
      atraso-inicial: 15000

resilience4j:
  retry:
    instances:
      mercadoPago:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  circuitbreaker:
    instances:
      mercadoPago:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

info:
  app:
    nome: ${spring.application.name}
    commit: ${GIT_COMMIT:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    mail:
      enabled: false
  info:
    git:
      mode: simple
    env:
      enabled: true
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${METRICS_EXPORT_STEP:60s}
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY:}
        resource-attributes:
          service.name: ${spring.application.name}
          service.environment: ${ENV:local}
          env: ${ENV:local}

logging:
  level:
    root: INFO
    com.oficina: INFO
    org.springframework.security: WARN
